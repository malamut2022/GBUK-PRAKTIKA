<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Глафира — демо ГБУК-ПРАКТИКА</title><style>body{margin:0;background:#f5f3ed;font:16px system-ui;color:#29332f}main{max-width:700px;margin:8vh auto;padding:24px}h1{color:#365849}.card{background:white;border-radius:18px;box-shadow:0 8px 30px #0001;padding:20px}.avatar{width:70px;height:70px;border-radius:50%;background:#e6ede9;display:grid;place-items:center;font-size:38px}#messages{height:300px;overflow:auto;display:flex;flex-direction:column;gap:10px;margin:18px 0;padding:12px;background:#f7f8f5;border-radius:12px}.msg{padding:12px;border-radius:12px;max-width:85%;background:white}.me{align-self:flex-end;background:#dcece5}form{display:flex;gap:8px}input{flex:1;min-width:0;padding:12px;border:1px solid #bbc9c1;border-radius:10px}button{cursor:pointer;border:0;border-radius:10px;padding:12px;background:#356c55;color:white}button:disabled{opacity:.5}.hint{font-size:13px;color:#5f6e67}</style><main><h1>ГБУК-ПРАКТИКА · Глафира</h1><div class="card"><div style="display:flex;align-items:center;gap:15px"><div class="avatar" aria-label="Временная иконка">👩🏻‍💼</div><div><b>Глафира</b><div class="hint">Демонстрационный помощник по разделам приложения</div></div><button id="sound" type="button" aria-label="Включить звук">🔇</button></div><div id="messages" aria-live="polite"><div class="msg">Здравствуйте! Я Глафира. Спросите, как добавить договор, проверить календарь или выплаты.</div></div><form id="form"><input id="question" aria-label="Ваш вопрос" placeholder="Напишите вопрос..." autocomplete="off"><button type="button" id="mic" title="Голосовой ввод">🎤</button><button type="submit">➤</button></form><p class="hint" id="status">Это тестовая версия на вымышленных данных. Для микрофона нужен поддерживаемый браузер и разрешение доступа.</p></div></main><script>const q=document.getElementById('question'),m=document.getElementById('messages'),status=document.getElementById('status'),sound=document.getElementById('sound');let speak=false;function add(t,me=false){let e=document.createElement('div');e.className='msg'+(me?' me':'');e.textContent=t;m.append(e);m.scrollTop=m.scrollHeight}function reply(t){let s=t.toLowerCase();if(/договор|созда|загруз/.test(s))return 'Чтобы добавить договор, откройте раздел «Договоры» и выберите загрузку документа. Условия оплаты и сроки перед сохранением должен проверить бухгалтер.';if(/календар|срок|отчёт/.test(s))return 'В разделе «Календарь» отслеживаются сроки отчётности и обязательств. Напоминания предусмотрены за 30, 20, 10, 7, 3 дня и 24 часа.';if(/агент|выплат|оплат/.test(s))return 'Проверьте раздел «Выплаты агентам» и условия конкретного договора. Я не могу назвать дату без текста договора.';if(/помощ|умеешь|раздел/.test(s))return 'Я подсказываю по договорам, календарю, обязательствам и выплатам агентам. Пока это справочник с чатом, а не полноценный ИИ.';return 'Пока я знаю только разделы «Договоры», «Календарь» и «Выплаты агентам». Попробуйте уточнить вопрос.'}document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();let t=q.value.trim();if(!t)return;add(t,true);q.value='';let a=reply(t);add(a);if(speak&&'speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(a);u.lang='ru-RU';u.rate=.88;u.pitch=.96;u.volume=.92;speechSynthesis.speak(u)}});sound.onclick=()=>{speak=!speak;sound.textContent=speak?'🔊':'🔇';sound.setAttribute('aria-label',speak?'Выключить звук':'Включить звук');status.textContent=speak?'Озвучивание включено. Голос зависит от браузера.':'Озвучивание выключено.'};const SR=window.SpeechRecognition||window.webkitSpeechRecognition;const mic=document.getElementById('mic');if(!SR){mic.disabled=true;status.textContent='В этом браузере распознавание речи недоступно. Текстовый чат работает.'}else{let rec=new SR();rec.lang='ru-RU';rec.interimResults=false;rec.onresult=e=>{q.value=e.results[0][0].transcript;status.textContent='Речь распознана. Нажмите отправить.'};rec.onerror=e=>{status.textContent='Ошибка микрофона: '+e.error+'. Проверьте разрешение браузера.'};rec.onend=()=>mic.textContent='🎤';mic.onclick=()=>{try{rec.start();mic.textContent='⏹';status.textContent='Слушаю...'}catch(e){status.textContent='Не удалось запустить микрофон.'}}}</script></html>
